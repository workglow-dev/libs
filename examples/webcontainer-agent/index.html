<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workglow WebContainer Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 26rem 1fr;
      }
      aside {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        overflow: hidden;
        border-right: 1px solid #8884;
      }
      main {
        display: grid;
        grid-template-rows: 1fr 12rem;
        min-width: 0;
      }
      label {
        display: grid;
        gap: 0.2rem;
        font-size: 0.8rem;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
        padding: 0.4rem;
      }
      textarea {
        min-height: 6rem;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
      .row > * {
        flex: 1;
      }
      #log {
        flex: 1;
        overflow: auto;
        font:
          0.75rem/1.4 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      #files {
        margin: 0;
        padding: 0.5rem;
        overflow: auto;
        font:
          0.75rem/1.4 ui-monospace,
          monospace;
        border-top: 1px solid #8884;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: Canvas;
      }
      #status {
        font-size: 0.8rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1 style="font-size: 1.1rem; margin: 0">WebContainer agent</h1>
      <div id="status">Booting sandbox…</div>
      <label
        >Provider
        <select id="provider">
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="google">Google Gemini</option>
        </select>
      </label>
      <label>Model <input id="model" /></label>
      <label
        >API key (kept in memory, sent only to the provider)
        <input id="key" type="password" autocomplete="off" />
      </label>
      <label
        >What should it build?
        <textarea id="prompt">
A to-do list page with add, check off and delete, saved in localStorage.</textarea>
      </label>
      <div class="row">
        <button id="run" disabled>Build</button><button id="stop" disabled>Stop</button>
      </div>
      <div id="log"></div>
    </aside>
    <main>
      <iframe id="preview" allow="cross-origin-isolated" title="Preview"></iframe>
      <pre id="files">(no files yet)</pre>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
