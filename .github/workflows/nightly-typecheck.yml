# Every `setup-bun` here takes `latest`, deliberately. The suites are what this
# repository ships against a moving runtime: `bunfig.toml`'s compatibility shim
# is written against the gaps in Bun's own `vitest` shim and each of its guards
# is meant to stand down once Bun ships its own, which only running a new Bun
# can ever reveal. `engines` already states the floor (`bun >= 1.4.0`, where
# `node:sqlite` arrives) and `latest` is always above it.
#
# The cost is real and accepted: a Bun regression can redden every PR on a day
# nobody touched the code. That is the trade — finding out on the day Bun ships
# it, rather than at the next manual bump. One spelling in every job, so there
# is no version to keep in sync; `packageManager` still pins local installs.
name: Nightly type-drift guard
permissions:
  contents: read
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
env:
  CI: "true"
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  type-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun i
      - name: Build type declarations
        run: bun run build:types
      # `.test-d.ts` files only run in vitest's typecheck mode. `--typecheck.only`
      # disables the runtime test run so this stays cheap.
      - run: bunx vitest run --typecheck --typecheck.only packages/ai/src/task/__tests__/types.test-d.ts
